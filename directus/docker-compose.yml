version: "3.8"

services:
  database:
    image: postgres:16-alpine
    container_name: vinfast_directus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus_local_password}
      POSTGRES_DB: ${DB_DATABASE:-directus_vinfast}
    volumes:
      - ./data/database:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXPOSE:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus} -d ${DB_DATABASE:-directus_vinfast}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: vinfast_directus_cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_EXPOSE:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  directus:
    image: directus/directus:latest
    container_name: vinfast_directus_app
    restart: unless-stopped
    ports:
      - "${PORT:-8055}:8055"
    environment:
      KEY: "${KEY}"
      SECRET: "${SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"

      DB_CLIENT: "${DB_CLIENT:-pg}"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"

      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_STORE: "${CACHE_STORE:-redis}"
      REDIS: "${REDIS:-redis://cache:6379}"

      STORAGE_LOCATIONS: "${STORAGE_LOCATIONS:-local}"
      STORAGE_LOCAL_ROOT: "./uploads"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8055}"

      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_METHODS: "GET,POST,PATCH,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Partner-Key"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
